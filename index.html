<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA Generator - Premium Edition 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #DA291C;
            --secondary: #FFC72C;
            --dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .container {
            background: var(--glass);
            width: 100%;
            max-width: 480px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 3px solid var(--secondary);
            position: relative;
        }

        .header {
            background: var(--primary);
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-family: 'Oswald', sans-serif;
            color: white;
            font-size: 1.8rem;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        /* Stats Grid */
        .stats-bar {
            display: grid;
            grid-cols: 2;
            grid-template-columns: 1fr 1fr;
            background: #222;
            color: white;
            padding: 10px;
            gap: 10px;
        }

        .stat-item {
            text-align: center;
            border-right: 1px solid #444;
        }
        .stat-item:last-child { border: none; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; color: var(--secondary); }
        .stat-value { font-size: 1rem; font-weight: bold; }

        .content { padding: 30px 25px; text-align: center; }

        /* Filter Style */
        .filter-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .filter-group label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #444;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
            background: white;
            font-family: 'Poppins';
            font-weight: 600;
            outline: none;
        }

        #ua-display {
            background: #f1f1f1;
            border: 2px dashed #bbb;
            padding: 15px;
            border-radius: 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
            font-family: 'monospace';
            font-size: 0.8rem;
            color: #333;
            margin-bottom: 20px;
        }

        .loader {
            display: none;
            width: 30px;
            height: 30px;
            border: 4px solid #ddd;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .cta-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(218, 41, 28, 0.3);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .cta-btn:hover { background: #b31d14; transform: translateY(-2px); }
        .cta-btn:disabled { background: #888; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ID GENERATOR PRO</h1>
        <div style="color:var(--secondary); font-weight:800; font-size:0.9rem;">SECURE FETCH SYSTEM v2.0</div>
    </div>

    <!-- Live Statistics -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-label">Database Total</div>
            <div id="total-pool" class="stat-value">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Filtered Available</div>
            <div id="filter-count" class="stat-value">0</div>
        </div>
    </div>

    <div class="content">
        <!-- Filter Dropdown -->
        <div class="filter-group">
            <label><i class="fab fa-chrome"></i> Target Chrome Version</label>
            <select id="version-select">
                <option value="">ALL VERSIONS (RANDOM)</option>
                <option value="140">CHROME 140.x</option>
                <option value="141">CHROME 141.x</option>
                <option value="142">CHROME 142.x</option>
                <option value="143">CHROME 143.x</option>
                <option value="144">CHROME 144.x</option>
                <option value="145">CHROME 145.x</option>
                <option value="146">CHROME 146.x</option>
                <option value="147">CHROME 147.x</option>
            </select>
        </div>

        <div id="ua-display">
            <div class="loader" id="loader"></div>
            <span id="ua-text">READY TO FETCH DATA...</span>
        </div>

        <button class="cta-btn" id="fetch-btn" onclick="fetchAgent()">
            <span id="btn-text">GENERATE AGENT</span>
            <i class="fas fa-bolt" id="btn-icon"></i>
        </button>

        <div style="font-size: 0.65rem; color: #999; margin-top: 15px; font-weight: 600;">
            <i class="fas fa-shield-alt" style="color: #28a745;"></i> ENCRYPTED CONNECTION ESTABLISHED
        </div>
    </div>
</div>

<script>
    // පියවර 2 දී ගත්තු ඔයාගේ අලුත් Web App URL එක මෙතනට දාන්න
    const API_URL = "https://script.google.com/macros/s/AKfycbyANco-VSuPnEh7EFr-Rsr2T5M5CqI-x2x8gGWkodOWIeihTP8kC2SJ_pcdNbiybIVRqw/exec";

    async function fetchAgent() {
        const display = document.getElementById('ua-text');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');
        const btn = document.getElementById('fetch-btn');
        const version = document.getElementById('version-select').value;
        const totalPool = document.getElementById('total-pool');
        const filterCount = document.getElementById('filter-count');

        display.style.display = "none";
        loader.style.display = "block";
        btnText.innerText = "PROCESSING...";
        btn.disabled = true;

        try {
            const finalUrl = version ? `${API_URL}?version=${version}` : API_URL;
            const response = await fetch(finalUrl);
            const data = await response.json();
            
            display.innerText = data.ua;
            totalPool.innerText = data.total_pool;
            filterCount.innerText = data.filtered_count;

        } catch (error) {
            display.innerText = "CONNECTION ERROR!";
            console.error(error);
        } finally {
            display.style.display = "block";
            loader.style.display = "none";
            btnText.innerText = "GENERATE AGENT";
            btn.disabled = false;
        }
    }

    // Page එක load වෙද්දීම stats පෙන්නන්න එක පාරක් fetch කරනවා
    window.onload = fetchAgent;
</script>

</body>
