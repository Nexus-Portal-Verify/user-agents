<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA Generator Ultra - Premium Edition</title>
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #DA291C;
            --secondary: #FFC72C;
            --dark: #0f1115;
            --glass: #ffffff;
            --success: #28a745;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* --- Announcement Styles --- */
        .top-announcement {
            background: #000;
            color: var(--secondary);
            font-size: 0.7rem;
            font-weight: bold;
            padding: 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 2px solid var(--secondary);
        }

        .scrolling-text {
            display: inline-block;
            padding-left: 100%;
            animation: scroll 15s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .container {
            background: var(--glass);
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 4px solid var(--secondary);
        }

        .header {
            background: var(--primary);
            padding: 20px 20px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
            color: white;
        }

        .header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: #111;
            color: white;
            padding: 12px 5px;
            text-align: center;
        }

        .stat-label { font-size: 0.6rem; color: var(--secondary); font-weight: 700; text-transform: uppercase; }
        .stat-value { font-size: 1rem; font-weight: 800; font-family: 'Oswald', sans-serif; }

        .content { padding: 25px; }

        .filter-label { font-size: 0.75rem; font-weight: 800; color: #444; margin-bottom: 8px; display: block; text-transform: uppercase; }
        
        .brand-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .brand-item { background: #f4f4f4; border: 2px solid #ddd; padding: 10px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
        .brand-item input { display: none; }
        .brand-item i { display: block; font-size: 1.2rem; margin-bottom: 5px; }
        .brand-item span { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .brand-item.active { background: #fff5f5; border-color: var(--primary); color: var(--primary); }

        select { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #ddd; font-family: 'Poppins'; font-weight: 600; margin-bottom: 20px; outline: none; }
        
        .fb-filter-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        #ua-display {
            background: #f1f1f1;
            border: 2px dashed #bbb;
            padding: 15px;
            border-radius: 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
            font-family: 'monospace';
            font-size: 0.8rem;
            color: #333;
            margin-bottom: 20px;
        }

        .loader { display: none; width: 30px; height: 30px; border: 4px solid #ddd; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .cta-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(218, 41, 28, 0.3);
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .cta-btn:hover { background: #b31d14; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="container">
    <!-- Announcement Bar -->
    <div class="top-announcement">
        <div class="scrolling-text">
            ⚠️ NOTICE: Connection might be slow due to real-time Google Sheets database sync. Please wait a moment while fetching your unique user agents.
        </div>
    </div>

    <div class="header">
        <h1>ID GENERATOR PRO</h1>
        <div style="color:var(--secondary); font-weight:800; font-size:0.8rem;">UNIQUE MOBILE AGENT FETCH</div>
    </div>

    <div class="stats-bar">
        <div><div class="stat-label">Total Pool</div><div id="total-pool" class="stat-value">0</div></div>
        <div><div class="stat-label">Available</div><div id="filter-count" class="stat-value">0</div></div>
        <div><div class="stat-label">Status</div><div id="ua-age" class="stat-value" style="color:var(--secondary)">-</div></div>
    </div>

    <div class="content">
        <label class="filter-label">1. Select Device Brands:</label>
        <div class="brand-grid">
            <label class="brand-item active">
                <input type="checkbox" value="samsung" checked onchange="updateUI(this)">
                <i class="fas fa-mobile-alt"></i><span>Samsung</span>
            </label>
            <label class="brand-item active">
                <input type="checkbox" value="pixel" checked onchange="updateUI(this)">
                <i class="fas fa-robot"></i><span>Pixel</span>
            </label>
            <label class="brand-item active">
                <input type="checkbox" value="motorola" checked onchange="updateUI(this)">
                <i class="fas fa-microchip"></i><span>Motorola</span>
            </label>
        </div>

        <label class="filter-label">2. Chrome Version:</label>
        <select id="version-select">
            <option value="">RANDOM VERSION</option>
            <script>
                for(let v=147; v>=129; v--) {
                    document.write(`<option value="${v}">Chrome ${v}.x</option>`);
                }
            </script>
        </select>

        <div class="fb-filter-box">
            <span style="font-size: 0.75rem; font-weight: 800; color: #444;">FACEBOOK IN-APP (IAB)</span>
            <label class="switch">
                <input type="checkbox" id="fb-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div id="ua-display">
            <div class="loader" id="loader"></div>
            <span id="ua-text">Click generate to start...</span>
        </div>

        <button class="cta-btn" id="fetch-btn" onclick="fetchAgent()">
            <span id="btn-text">GENERATE UNIQUE USER AGENT</span>
            <i class="fas fa-bolt"></i>
        </button>
    </div>
</div>

<script>
    // පියවර 1 දී ලැබුණු Google Script Web App URL එක මෙතනට දාන්න
    const API_URL = "https://script.google.com/macros/s/AKfycbyANco-VSuPnEh7EFr-Rsr2T5M5CqI-x2x8gGWkodOWIeihTP8kC2SJ_pcdNbiybIVRqw/exec";

    function updateUI(el) {
        el.parentElement.classList.toggle('active', el.checked);
    }

    async function fetchAgent() {
        const display = document.getElementById('ua-text');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');
        const btn = document.getElementById('fetch-btn');

        const brands = [];
        document.querySelectorAll('.brand-item input:checked').forEach(i => brands.push(i.value));
        const version = document.getElementById('version-select').value;
        const fbStatus = document.getElementById('fb-toggle').checked ? "on" : "off";

        if(brands.length === 0) { alert("Please select at least one brand!"); return; }

        display.style.display = "none";
        loader.style.display = "block";
        btn.disabled = true;
        btnText.innerText = "FETCHING...";

        try {
            const finalUrl = `${API_URL}?brands=${brands.join(',')}&version=${version}&fb_filter=${fbStatus}`;
            const response = await fetch(finalUrl);
            const data = await response.json();
            
            if (data.ua === "NO_MORE_AGENTS") {
                display.innerHTML = "<b style='color:red;'>OUT OF STOCK!</b>";
                document.getElementById('ua-age').innerText = "EMPTY";
            } else {
                display.innerText = data.ua;
                document.getElementById('ua-age').innerText = "JUST NOW";
            }

            document.getElementById('total-pool').innerText = data.total_pool;
            document.getElementById('filter-count').innerText = data.filtered_count;

        } catch (error) {
            display.innerText = "API Connection Error!";
        } finally {
            display.style.display = "block";
            loader.style.display = "none";
            btn.disabled = false;
            btnText.innerText = "GENERATE UNIQUE UA";
        }
    }
</script>

</body>
</html>
